name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Resolve dependencies
        working-directory: server
        run: go mod tidy

      - name: Vet
        working-directory: server
        run: go vet ./...

      - name: Build
        working-directory: server
        run: go build -o promptops .

      - name: Test
        working-directory: server
        run: go test ./...

      - name: Smoke test (start server + exercise API)
        run: bash scripts/smoke.sh

  frontend:
    name: Frontend (Vue3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: web
        run: npm install

      - name: Build
        working-directory: web
        run: npm run build

  sdk-node:
    name: SDK - Node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        working-directory: sdk/node
        run: npm install
      - name: Test
        working-directory: sdk/node
        run: node --test

  sdk-python:
    name: SDK - Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test
        working-directory: sdk/python
        run: python -m unittest discover -s tests -v

  sdk-java:
    name: SDK - Java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and test
        working-directory: sdk/java
        run: |
          javac -d out $(find src -name '*.java')
          java -cp out io.promptops.PromptOpsClientTest

  integration:
    name: SDK Integration (server + hot-reload)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build server
        working-directory: server
        run: go mod tidy && go build -o promptops .

      - name: Install Node SDK dependencies
        working-directory: sdk/node
        run: npm install

      - name: Run SDK integration tests
        run: bash scripts/sdk-integration.sh
